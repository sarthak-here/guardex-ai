name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

# Default least-privilege token for the whole workflow.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only the deploy job needs write access to push to the gh-pages branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install docs dependencies
        run: pip install mkdocs-material==9.5.34

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
